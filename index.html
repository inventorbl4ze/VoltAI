
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10091f">
<title>Nova AI 💜</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10091f;color:#fff;font-family:Arial,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{padding:17px;background:#1c1033;border-bottom:1px solid #49316a;display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#c084fc,#6338c5);font-size:26px}
h2{margin:0 0 5px;font-size:20px}
header p{margin:0;color:#cdb8ee;font-size:12px}
#chat{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:14px}
.message{padding:13px 15px;border-radius:17px;max-width:88%;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{align-self:flex-start;background:#281943;border:1px solid #49316a;border-bottom-left-radius:5px}
.user{align-self:flex-end;background:#7443ca;border-bottom-right-radius:5px}
footer{padding:12px;background:#1c1033;border-top:1px solid #49316a}
#composer{display:flex;gap:8px}
textarea{flex:1;min-width:0;resize:none;max-height:120px;padding:13px;border:1px solid #594075;border-radius:14px;background:#110b20;color:white;font-size:15px}
button{border:0;border-radius:12px;padding:12px;background:#9659ed;color:white;font-size:15px}
.tools{display:flex;justify-content:space-between;margin-top:8px}
.tools button{background:transparent;color:#d5c0f2;font-size:12px}
</style>
</head>
<body>
<header>
<div class="avatar">✦</div>
<div><h2>Nova AI 💜</h2><p>Here to explore the universe with you</p></div>
</header>
<main id="chat">
<div class="message bot">Hey! 💜 I'm Nova, your AI companion.

Ask me about science, maths, coding, technology, music, or anything you're curious about.

Let's make today magical! ✨</div>
</main>
<footer>
<div id="composer">
<textarea id="input" rows="1" placeholder="Ask Nova anything..."></textarea>
<button id="send">➤</button>
</div>
<div class="tools">
<button id="speak">🔊 Read last reply</button>
<button id="clear">＋ New chat</button>
</div>
</footer>
<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");

function addMessage(text,type){
 const el=document.createElement("div");
 el.className="message "+type;
 el.textContent=text;
 chat.appendChild(el);
 chat.scrollTop=chat.scrollHeight;
 return el;
}

function sendMessage(){
 const text=input.value.trim();
 if(!text)return;
 addMessage(text,"user");
 input.value="";
 addMessage("Nova's chat interface is working! 💜 We're setting up the real AI connection next.","bot");
}
document.getElementById("send").onclick=sendMessage;
input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});
document.getElementById("speak").onclick=()=>{
 const replies=chat.querySelectorAll(".bot");
 const last=replies[replies.length-1];
 if(!last)return;
 if(!("speechSynthesis" in window)){
  alert("Voice playback isn't available in this browser.");
  return;
 }
 speechSynthesis.cancel();
 speechSynthesis.speak(new SpeechSynthesisUtterance(last.textContent));
};
document.getElementById("clear").onclick=()=>{
 chat.replaceChildren();
 addMessage("A fresh start! 💜 What would you like to explore?","bot");
 if("speechSynthesis" in window)speechSynthesis.cancel();
};
</script>
</body>
</html>
